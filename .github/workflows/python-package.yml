# This workflow will install Python dependencies, run tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minor versions only, so each run picks up the latest patch release
        python-version: ["3.10", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up python
      run: uv python install

    # --upgrade ignores the pins in uv.lock and resolves the newest versions
    # allowed by pyproject.toml, so that breakage from a new release of a
    # dependency shows up here rather than in users' environments
    - name: Install the project with the latest dependencies
      run: uv sync --dev --upgrade

    - name: Show resolved dependency versions
      run: uv pip list

    - name: Run tests
      run: uv run pytest tests
