<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="652" viewBox="0 0 840 652" role="img" aria-labelledby="title description">
  <title id="title">The same regression tree at four pruning penalties</title>
  <desc id="description">Four snapshots use fixed node positions and IDs. A, penalty zero: root 0 splits at x 1.5, left node 1 at 0.5, and right node 2 at 2.5; leaves predict -3, -1, 1, and 4. B, penalty 0.5: node 1 becomes a leaf predicting -2, and its children disappear. C, penalty 0.75: node 2 also becomes a leaf, predicting 2.5. D, penalty 2.25: root 0 becomes the only leaf, predicting the overall mean 0.25. Faint dashed lines mark removed branches, not active structure. No descendants are promoted. Leaf labels are pooled original CART means, not penalized coefficient predictions.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #243247; }
    .title { font-size: 20px; font-weight: 650; }
    .heading { font-size: 15px; font-weight: 650; }
    .small { font-size: 12px; fill: #526175; }
    .node-id { font-size: 11px; fill: #526175; }
    .node-value { font-size: 13px; }
    .split { fill: #ffffff; stroke: #8a97a8; }
    .leaf { fill: #e8f2fa; stroke: #7aa3c4; }
    .collapsed { fill: #eee7f4; stroke: #9778af; }
    .edge { fill: none; stroke: #8a97a8; stroke-width: 1.5; }
  </style>
  <defs>
    <!-- All panels reuse these exact original coordinates; no tree relayout. -->
    <path id="branches" d="M 190 63 L 90 125 M 190 63 L 290 125 M 90 125 L 40 185 M 90 125 L 140 185 M 290 125 L 240 185 M 290 125 L 340 185"/>
    <g id="ghosts">
      <use xlink:href="#branches" fill="none" stroke="#dce2ea" stroke-dasharray="3 4"/>
      <g fill="#dce2ea">
        <circle cx="190" cy="63" r="3"/>
        <circle cx="90" cy="125" r="3"/><circle cx="290" cy="125" r="3"/>
        <circle cx="40" cy="185" r="3"/><circle cx="140" cy="185" r="3"/>
        <circle cx="240" cy="185" r="3"/><circle cx="340" cy="185" r="3"/>
      </g>
    </g>
    <g id="root-split" text-anchor="middle">
      <rect x="150" y="45" width="80" height="36" rx="6" class="split"/>
      <text x="190" y="59" class="node-id">#0</text>
      <text x="190" y="74" class="node-value">x ≤ 1.5</text>
    </g>
    <g id="left-split" text-anchor="middle">
      <rect x="50" y="107" width="80" height="36" rx="6" class="split"/>
      <text x="90" y="121" class="node-id">#1</text>
      <text x="90" y="136" class="node-value">x ≤ 0.5</text>
    </g>
    <g id="right-split" text-anchor="middle">
      <rect x="250" y="107" width="80" height="36" rx="6" class="split"/>
      <text x="290" y="121" class="node-id">#2</text>
      <text x="290" y="136" class="node-value">x ≤ 2.5</text>
    </g>
    <g id="right-leaves" text-anchor="middle">
      <rect x="203" y="167" width="74" height="36" rx="6" class="leaf"/>
      <text x="240" y="181" class="node-id">#3</text>
      <text x="240" y="196" class="node-value">ŷ = 1</text>
      <rect x="303" y="167" width="74" height="36" rx="6" class="leaf"/>
      <text x="340" y="181" class="node-id">#4</text>
      <text x="340" y="196" class="node-value">ŷ = 4</text>
    </g>
    <g id="left-collapsed" text-anchor="middle">
      <rect x="50" y="107" width="80" height="36" rx="6" class="collapsed"/>
      <text x="90" y="121" class="node-id">#1</text>
      <text x="90" y="136" class="node-value">ŷ = −2</text>
    </g>
  </defs>
  <rect width="840" height="652" rx="12" fill="#ffffff"/>
  <text x="30" y="32" class="title">The same tree as the penalty increases</text>
  <text x="30" y="55" class="small">A–D match the structural path · fixed node IDs and positions · left branch: ≤; right branch: &gt;</text>
  <rect x="30" y="75" width="16" height="14" rx="3" class="split"/>
  <text x="54" y="87" class="small">Split</text>
  <rect x="123" y="75" width="16" height="14" rx="3" class="leaf"/>
  <text x="147" y="87" class="small">Original leaf</text>
  <rect x="258" y="75" width="16" height="14" rx="3" class="collapsed"/>
  <text x="282" y="87" class="small">Collapsed subtree → leaf</text>
  <path d="M 495 82 H 523" stroke="#c3ccd8" stroke-dasharray="3 4"/>
  <text x="531" y="87" class="small">Removed structure (guide only)</text>

  <g transform="translate(20 112)" data-stage="A" data-splits="3" data-lambda="0">
    <rect width="390" height="224" rx="10" fill="#fafbfd" stroke="#e3e8ef"/>
    <text x="14" y="25" class="heading">A · λ = 0 · 3 splits / 4 leaves</text>
    <use xlink:href="#branches" class="edge"/>
    <use xlink:href="#root-split"/>
    <use xlink:href="#left-split"/>
    <use xlink:href="#right-split"/>
    <use xlink:href="#right-leaves"/>
    <g text-anchor="middle">
      <rect x="3" y="167" width="74" height="36" rx="6" class="leaf"/>
      <text x="40" y="181" class="node-id">#5</text>
      <text x="40" y="196" class="node-value">ŷ = −3</text>
      <rect x="103" y="167" width="74" height="36" rx="6" class="leaf"/>
      <text x="140" y="181" class="node-id">#6</text>
      <text x="140" y="196" class="node-value">ŷ = −1</text>
    </g>
  </g>
  <g transform="translate(430 112)" data-stage="B" data-splits="2" data-lambda="0.5">
    <rect width="390" height="224" rx="10" fill="#fafbfd" stroke="#e3e8ef"/>
    <text x="14" y="25" class="heading">B · λ = 0.5 · 2 splits / 3 leaves</text>
    <use xlink:href="#ghosts"/>
    <path d="M 190 63 L 90 125 M 190 63 L 290 125 M 290 125 L 240 185 M 290 125 L 340 185" class="edge"/>
    <use xlink:href="#root-split"/>
    <use xlink:href="#left-collapsed"/>
    <use xlink:href="#right-split"/>
    <use xlink:href="#right-leaves"/>
  </g>
  <g transform="translate(20 352)" data-stage="C" data-splits="1" data-lambda="0.75">
    <rect width="390" height="224" rx="10" fill="#fafbfd" stroke="#e3e8ef"/>
    <text x="14" y="25" class="heading">C · λ = 0.75 · 1 split / 2 leaves</text>
    <use xlink:href="#ghosts"/>
    <path d="M 190 63 L 90 125 M 190 63 L 290 125" class="edge"/>
    <use xlink:href="#root-split"/>
    <use xlink:href="#left-collapsed"/>
    <g text-anchor="middle">
      <rect x="250" y="107" width="80" height="36" rx="6" class="collapsed"/>
      <text x="290" y="121" class="node-id">#2</text>
      <text x="290" y="136" class="node-value">ŷ = 2.5</text>
    </g>
  </g>
  <g transform="translate(430 352)" data-stage="D" data-splits="0" data-lambda="2.2500000000000004">
    <rect width="390" height="224" rx="10" fill="#fafbfd" stroke="#e3e8ef"/>
    <text x="14" y="25" class="heading">D · λ = 2.25 · 0 splits / 1 leaf</text>
    <use xlink:href="#ghosts"/>
    <g text-anchor="middle">
      <rect x="150" y="45" width="80" height="36" rx="6" class="collapsed"/>
      <text x="190" y="59" class="node-id">#0</text>
      <text x="190" y="74" class="node-value">ŷ = 0.25</text>
    </g>
  </g>
  <text x="30" y="606" class="small">A subtree becomes one leaf at its original root. Descendants disappear; nothing moves upward.</text>
  <text x="30" y="628" class="small">Leaf labels are pooled training means, not penalized coefficient predictions. No HS. Penalty labels rounded.</text>
</svg>
