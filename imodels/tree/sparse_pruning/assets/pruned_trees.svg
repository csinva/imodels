<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1010" viewBox="0 0 960 1010" role="img" aria-labelledby="title description">
  <title id="title">The overfit tree at key pruning penalties</title>
  <desc id="description">Four panels preserve original node IDs and positions. A: the original 280-split tree is summarized by three visible splits and subtrees containing 102, 30, 80, and 65 splits; the summary boxes are not leaves. B: the validation-selected 3-split tree retains splits 0, 1, and 207, using only the two signal features. Validation accuracy is 84.6 percent. C: at 2 splits, node 207 becomes a leaf for its 729 training observations, and validation accuracy drops to 74.925 percent. D: the root is the only leaf, with validation accuracy 51.125 percent. Blue leaves predict class 0; orange leaves predict class 1. P1 is pooled training frequency, not optimized logistic probability. Faint dashed branches are removed structure, shown only as a positional guide. Threshold and penalty labels are rounded. No HS.</desc>
  <style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #243247; } .title { font-size: 22px; font-weight: 650; } .heading { font-size: 16px; font-weight: 650; } .label { font-size: 14px; } .small { font-size: 12px; fill: #526175; } .stage { font-size: 16px; font-weight: 700; fill: #126d56; } .grid { stroke: #e3e8ef; stroke-width: 1; } .axis { fill: none; stroke: #8a97a8; stroke-width: 1; }</style>
  <rect width="960" height="1010" rx="12" fill="#ffffff"/>
  <!-- Fixed-seed synthetic experiment. Reproduction code is in README.md. Curves use production structural knots, before HS. -->
