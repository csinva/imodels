<svg xmlns="http://www.w3.org/2000/svg" width="960" height="735" viewBox="0 0 960 735" role="img" aria-labelledby="title description">
  <title id="title">Overfit to useful pruning to underfit</title>
  <desc id="description">Synthetic binary classification, seed 42: 2 signal and 10 irrelevant features, 15 percent random label flips. A fully grown tree starts with 280 splits, 100 percent training accuracy and 73.525 percent validation accuracy. The validation-selected 3-split tree reaches peak validation accuracy 84.6 percent, and independent test accuracy 84.65 percent. Excess pruning reduces validation accuracy to 74.925 percent at 2 splits and 51.125 percent at the root-only tree. The upper panel shows training and validation accuracy, with independent test diamonds at only the unpruned, selected, and root-only states. The lower panel shows retained splits and an inset resolving the early rise in validation accuracy. All penalty axes are linear and normalized by the root-only penalty. A through D match the tree snapshots. Test data never select the penalty. Classification error, one minus accuracy, has the opposite U-shaped pattern.</desc>
